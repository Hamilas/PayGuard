      <stop offset="100%" style="stop-color:#0a0f1e;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bgPayGuardML)"/>
  <rect width="1280" height="320" fill="url(#gridPayGuardML)" opacity="0.4"/>
